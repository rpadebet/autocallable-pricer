[server]
# Disable file watching entirely.
#
# WHY: This app folder lives on OneDrive, which continuously syncs files
# (timestamps, .pyc bytecode, temp files). Streamlit's default file watcher
# detects these as "code changed" events and restarts the server, wiping all
# session state mid-session. Disabling the watcher prevents that.
#
# Trade-off: you must manually stop (Ctrl+C) and re-run
#   streamlit run app/Home.py
# after editing code. This is fine for a finished demo app.
fileWatcherType = "none"
runOnSave = false

[browser]
gatherUsageStats = false
